# The whole application: `cp .env.example .env && docker compose up --build` -> http://localhost:8080
# (dzen-test-front must be cloned next to this repository: the SPA is built from ../dzen-test-front).
# Caddy serves the SPA and the API on one origin, as in production. Django is also published on :8000
# for `npm run dev` in the front (its Vite proxy) and for the API docs.
# Services for queues, search etc. are added together with the features that use them.
services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    ports:
      - "127.0.0.1:3307:3306"  # `uv run` on the host and MySQL Workbench connect here
    volumes:
      - mysqldata:/var/lib/mysql
      - ./docker/mysql-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    ports:
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: dzen  # the default guest user may only connect from localhost
      RABBITMQ_DEFAULT_PASS: dzen
    ports:
      - "127.0.0.1:5673:5672"    # `uv run celery -A config worker` on the host
      - "127.0.0.1:15673:15672"  # management UI: http://localhost:15673 (dzen / dzen)
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
    restart: unless-stopped

  app:
    build: .
    env_file: .env
    environment:
      # .env holds the values for `uv run` on the host; inside the network these differ
      DB_HOST: db
      DB_PORT: "3306"
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_URL: amqp://dzen:dzen@rabbitmq:5672//
    volumes:
      - media:/app/media
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  # Background tasks (image resizing); the same image as `app`, the app container runs the migrations
  worker:
    build: .
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_URL: amqp://dzen:dzen@rabbitmq:5672//
      RUN_MIGRATIONS: "0"
    command: ["celery", "-A", "config", "worker", "--loglevel", "info", "--concurrency", "2"]
    volumes:
      - media:/app/media  # resizes the files the app saved
    healthcheck:
      disable: true  # the image's healthcheck probes the HTTP server, which a worker does not run
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

  front:
    build: ../dzen-test-front
    restart: unless-stopped

  caddy:
    image: caddy:2.10-alpine
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - media:/srv/media:ro  # attachments are served by Caddy, as in production
    depends_on:
      app:
        condition: service_healthy
      front:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mysqldata:
  media:
