type Attachment {
  id: ID!

  """image (fitted into 320x240) or text (TXT up to 100 KB)"""
  kind: String!

  """Relative URL on the same origin (/media/...)"""
  url: String!
  originalName: String!

  """Bytes of the stored file"""
  size: Int!
  width: Int
  height: Int

  """processing (image being resized), ready or failed"""
  status: String!
}

type Comment {
  id: ID!
  userName: String!
  email: String!
  homePage: String!

  """Sanitized HTML: only <a>, <code>, <i>, <strong>"""
  text: String!

  """Text hidden by a moderator; the card stays"""
  isUfo: Boolean!
  score: Int!

  """Direct replies visible to everyone"""
  repliesCount: Int!

  """0 for a top-level comment"""
  depth: Int!
  createdAt: DateTime!
  parentId: ID

  """The top-level comment of the thread"""
  rootId: ID

  """The text hidden by a moderator; moderators only, otherwise null"""
  originalText: String

  """The author is shadow-banned; moderators only, otherwise null"""
  isShadowed: Boolean

  """Posted by me (signed-in viewers): no voting on own comments"""
  isMine: Boolean!

  """My vote: 1, -1 or null (always null for guests)"""
  myVote: Int

  """In my bookmarks (always false for guests)"""
  bookmarked: Boolean!

  """Files attached to the comment (at most one at the moment)"""
  attachments: [Attachment!]!

  """The comment this one replies to (for the quote); null for top-level"""
  parent: Comment

  """Direct replies, oldest first; first <= 50, `after` = endCursor"""
  replies(first: Int! = 10, after: ID = null): ReplyPage!
}

type CommentPage {
  items: [Comment!]!
  totalCount: Int!
  page: Int!
  pageSize: Int!
  pageCount: Int!
}

"""Columns of the top-level table; the default is CREATED_AT_DESC (LIFO)"""
enum CommentSort {
  USER_NAME_ASC
  USER_NAME_DESC
  EMAIL_ASC
  EMAIL_DESC
  CREATED_AT_ASC
  CREATED_AT_DESC
}

"""Date with time (isoformat)"""
scalar DateTime

type Me {
  id: ID!
  username: String!
  email: String!
  homePage: String!
  isModerator: Boolean!

  """Everything I posted, replies included"""
  commentsCount: Int!
}

type Mutation {
  """Home page shown with my comments; an empty string clears it"""
  updateProfile(homePage: String!): Me!

  """Signs out every other session; returns a new access token for this one"""
  changePassword(oldPassword: String!, newPassword: String!): String!

  """Vote 1 or -1; voting again the other way changes the vote"""
  vote(commentId: ID!, value: Int!): VoteResult!

  """Take my vote back"""
  unvote(commentId: ID!): VoteResult!

  """Add to my bookmarks; returns true"""
  bookmark(commentId: ID!): Boolean!

  """Remove from my bookmarks; returns false"""
  unbookmark(commentId: ID!): Boolean!

  """
  "A UFO flew in": hide the text and attachments; the card and replies stay
  """
  ufoComment(commentId: ID!, reason: String! = ""): Comment!

  """Show the hidden text again"""
  restoreComment(commentId: ID!): Comment!

  """
  Shadow-ban the comment's author (account, or the guest's cookie and e-mail)
  """
  shadowban(commentId: ID!, hidePast: Boolean! = true, reason: String! = ""): ShadowBan!

  """Lift a ban: the author's comments are visible again"""
  unban(banId: ID!): ShadowBan!
}

type Query {
  """Counters for the stats cards; what a viewer may not know is null"""
  stats: StatsType!

  """Top-level comments, 25 per page"""
  comments(page: Int! = 1, sort: CommentSort! = CREATED_AT_DESC): CommentPage!

  """One comment (a thread link); null if it does not exist or is hidden"""
  comment(id: ID!): Comment

  """
  Comments posted after lastId, oldest first (after a WebSocket reconnect); limit <= 100
  """
  commentsSince(lastId: ID!, limit: Int! = 100): [Comment!]!

  """The signed-in user; null for guests"""
  me: Me

  """
  My comments and replies, newest first, 25 per page (shadowed ones included)
  """
  myComments(page: Int! = 1): CommentPage!

  """Comments I bookmarked, the latest bookmark first, 25 per page"""
  myBookmarks(page: Int! = 1): CommentPage!

  """Active shadow bans, the latest first"""
  shadowBans: [ShadowBan!]!
}

type ReplyPage {
  items: [Comment!]!
  hasMore: Boolean!

  """Pass as `after` to load the next replies"""
  endCursor: ID
}

type ShadowBan {
  id: ID!
  userName: String!
  email: String!
  isGuest: Boolean!
  reason: String!
  createdAt: DateTime!
  liftedAt: DateTime

  """The author's comments hidden by the ban"""
  commentsCount: Int!
}

type StatsType {
  """Comments this viewer can see"""
  comments: Int!

  """Hidden by a moderator"""
  ufo: Int!

  """Shadow-banned authors' comments (public on purpose)"""
  shadowed: Int!

  """Signed-in users only"""
  myComments: Int

  """Signed-in users only"""
  myBookmarks: Int
}

type VoteResult {
  commentId: ID!
  score: Int!

  """1, -1 or null after taking the vote back"""
  myVote: Int
}
